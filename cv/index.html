<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curriculum Vitae – Yu-You Liou</title>
<script>
(function () {
  // Follow the main site: manual choice (sessionStorage) wins, otherwise by clock
  var t = sessionStorage.getItem('theme');
  if (t !== 'light' && t !== 'dark') {
    var h = new Date().getHours();
    t = (h >= 7 && h < 19) ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
  @font-face {
    font-family: 'MyFont';
    src: url('/fonts/GenWanMin2TW-R-sub.woff2') format('woff2');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'MyFont';
    src: url('/fonts/GenWanMin2TW-M-sub.woff2') format('woff2');
    font-weight: 500; font-style: normal;
  }
  @font-face {
    font-family: 'MyFont';
    src: url('/fonts/GenWanMin2TW-SB-sub.woff2') format('woff2');
    font-weight: 600; font-style: normal;
  }
  :root {
    --bg: #fcfbf9; --heading: #1a2a3a; --muted: #888;
    --border: #e0dbd4; --btn-border: #c8c2ba; --accent: #2c5282;
  }
  [data-theme="dark"] {
    --bg: #141824; --heading: #dde3ec; --muted: #8a95a8;
    --border: #2a3040; --btn-border: #2a3040; --accent: #8fafc8;
  }
  html, body { margin: 0; }
  body {
    font-family: 'MyFont', 'Palatino Linotype', 'Palatino LT STD', 'Book Antiqua', Georgia, serif;
    background-color: var(--bg); color: var(--heading);
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.7rem 1.4rem; background-color: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 1.05rem; font-weight: 600; margin: 0; color: var(--heading);
  }
  .controls { display: inline-flex; gap: 0.5em; align-items: center; }
  .navbar-icon-btn, .dl-btn {
    background: none; border: 1px solid var(--btn-border); border-radius: 3px;
    font-family: inherit; font-size: 0.75rem; letter-spacing: 0.06em;
    color: var(--muted); padding: 0 10px; height: 28px; line-height: 28px;
    cursor: pointer; display: inline-flex; align-items: center;
    text-decoration: none; transition: color 0.2s, border-color 0.2s;
  }
  .navbar-icon-btn { width: 36px; min-width: 36px; padding: 0; justify-content: center; font-weight: 600; }
  .navbar-icon-btn:hover, .dl-btn:hover { color: var(--heading); border-color: var(--heading); }
  main { max-width: 920px; margin: 0 auto; padding: 1.4rem 1rem 3rem; }
  #pages canvas {
    display: block; margin: 0 auto 1.2rem; max-width: 100%;
    border: 1px solid var(--border);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08); background: #fff;
  }
  #status {
    text-align: center; color: var(--muted); font-size: 0.85rem; padding: 2.5rem 0;
  }
  #status a { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <h1 id="title">Curriculum Vitae</h1>
    <div class="controls">
      <button id="langBtn" class="navbar-icon-btn" onclick="toggleLang()">中</button>
      <a id="dl" class="dl-btn" href="cv.pdf" download>Download</a>
    </div>
  </header>
  <main>
    <div id="status">Loading…</div>
    <div id="pages"></div>
  </main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  var files  = { en: 'cv.pdf', zh: 'cv_zh.pdf' };
  var titles = { en: 'Curriculum Vitae', zh: '個人履歷' };
  var dlText = { en: 'Download', zh: '下載' };
  var lang = 'en';
  try { lang = localStorage.getItem('cv-lang') || 'en'; } catch (e) {}
  if (lang !== 'en' && lang !== 'zh') lang = 'en';

  function applyChrome() {
    document.getElementById('title').textContent = titles[lang];
    document.getElementById('langBtn').textContent = lang === 'en' ? '中' : 'Eng';
    var dl = document.getElementById('dl');
    dl.href = files[lang];
    dl.setAttribute('download', files[lang]);
    dl.textContent = dlText[lang];
    document.title = titles[lang] + ' – Yu-You Liou';
    document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  }

  function fallback() {
    document.getElementById('status').style.display = 'none';
    document.getElementById('pages').innerHTML =
      '<iframe src="' + files[lang] + '" style="width:100%;height:88vh;border:1px solid var(--border);background:#fff;display:block;"></iframe>';
  }

  var renderToken = 0;
  function render() {
    applyChrome();
    var token = ++renderToken;
    var pagesEl = document.getElementById('pages');
    var statusEl = document.getElementById('status');
    if (!window.pdfjsLib || location.protocol === 'file:') { fallback(); return; }
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    statusEl.style.display = 'block';
    statusEl.textContent = 'Loading…';
    pagesEl.innerHTML = '';
    pdfjsLib.getDocument(files[lang]).promise.then(function (pdf) {
      if (token !== renderToken) return;
      statusEl.style.display = 'none';
      var width = Math.min(pagesEl.clientWidth || 880, 880);
      var dpr = window.devicePixelRatio || 1;
      var chain = Promise.resolve();
      for (var i = 1; i <= pdf.numPages; i++) {
        (function (n) {
          chain = chain.then(function () {
            if (token !== renderToken) return;
            return pdf.getPage(n).then(function (page) {
              if (token !== renderToken) return;
              var vp = page.getViewport({ scale: 1 });
              var scale = width / vp.width;
              vp = page.getViewport({ scale: scale * dpr });
              var canvas = document.createElement('canvas');
              canvas.width = vp.width; canvas.height = vp.height;
              canvas.style.width = width + 'px';
              pagesEl.appendChild(canvas);
              return page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
            });
          });
        })(i);
      }
    }).catch(function () { if (token === renderToken) fallback(); });
  }

  function toggleLang() {
    lang = lang === 'en' ? 'zh' : 'en';
    try { localStorage.setItem('cv-lang', lang); } catch (e) {}
    render();
  }

  // Force a real download (instead of opening the PDF) when served over http(s)
  document.getElementById('dl').addEventListener('click', function (e) {
    if (location.protocol === 'file:') return; // fall back to default behaviour
    e.preventDefault();
    fetch(files[lang]).then(function (r) { return r.blob(); }).then(function (b) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = files[lang];
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }).catch(function () { location.href = files[lang]; });
  });

  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt); rt = setTimeout(render, 250);
  });
  render();
</script>
</body>
</html>
